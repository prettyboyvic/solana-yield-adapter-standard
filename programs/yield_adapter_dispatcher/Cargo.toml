[package]
name = "yield_adapter_dispatcher"
version = "0.1.0"
description = "Core dispatcher and governance-gated registry for Solana yield adapters."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "yield_adapter_dispatcher"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { workspace = true }
blake3 = { workspace = true }
hashbrown = { workspace = true }
proc-macro-crate = { workspace = true }
